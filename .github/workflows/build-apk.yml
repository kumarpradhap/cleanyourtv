name: Build launcher APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch - greeting names take turns, one per hour
        run: |
          python3 - <<'EOF'
          p = 'launcher/app/src/main/java/com/gathin/tvhome/MainActivity.java'
          s = open(p).read()
          old = '''            greeting.setText(greetingName.isEmpty() ? getString(res)
                              : getString(R.string.greeting_with_name, getString(res), greetingName));'''
          new = '''            // Several names separated by "|" take turns, one per hour.
                      String name = greetingName;
                      if (name.contains("|")) {
                          String[] names = name.split("\\\\|");
                          Calendar now = Calendar.getInstance();
                          int slot = now.get(Calendar.DAY_OF_YEAR) * 24 + now.get(Calendar.HOUR_OF_DAY);
                          name = names[slot % names.length].trim();
                      }
                      greeting.setText(name.isEmpty() ? getString(res)
                              : getString(R.string.greeting_with_name, getString(res), name));'''
          assert s.count(old) == 1, 'greeting line not found - launcher code changed'
          open(p, 'w').write(s.replace(old, new))
          print('patched')
          EOF
          grep -n -A9 'take turns, one per hour' launcher/app/src/main/java/com/gathin/tvhome/MainActivity.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../cleanyourtv-launcher.apk
          ls -l ../cleanyourtv-launcher.apk
          sha256sum ../cleanyourtv-launcher.apk

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Launcher build ${{ github.run_number }}
          files: cleanyourtv-launcher.apk
          make_latest: true